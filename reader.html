<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Слова">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon.png">
<title>Чтение · Слова</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400;1,7..72,500&display=swap" rel="stylesheet">
<style>
/* Same look as «Слова»: one book column under a slim sticky bar; translations rise from the bottom as a sheet; contents, books, words and text settings share one panel. */
:root{
  --bg:#FFFFFF; --ink:#141A26; --muted:#6B7280; --faint:#9CA3AF; --line:#E6E8EE; --panel:#F3F4F7; --sheet:#FFFFFF;
  --hl:#FFE566; --hl-ink:#141A26; --good:#1E7F4B; --good-bg:#E4F4EA;
  --shade:rgba(20,26,38,.32); --lift:0 -12px 32px rgba(20,26,38,.12), 0 -1px 0 rgba(20,26,38,.06);
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --text:var(--serif); --fs:18px; --lh:1.62; --col:35em; --bar-h:52px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15171C; --ink:#F1F2F5; --muted:#9AA0AC; --faint:#6B7280; --line:#2A2E37; --panel:#1F2229; --sheet:#1C1F26;
    --hl:rgba(255,229,102,.30); --hl-ink:#F1F2F5; --good:#5CC48B; --good-bg:#183324;
    --shade:rgba(0,0,0,.55); --lift:0 -12px 32px rgba(0,0,0,.5), 0 -1px 0 rgba(255,255,255,.05); color-scheme:dark; }
}
html:root[data-rt="light"]{ --bg:#FFFFFF; --ink:#141A26; --muted:#6B7280; --faint:#9CA3AF; --line:#E6E8EE; --panel:#F3F4F7; --sheet:#FFFFFF;
  --hl:#FFE566; --hl-ink:#141A26; --good:#1E7F4B; --good-bg:#E4F4EA;
  --shade:rgba(20,26,38,.32); --lift:0 -12px 32px rgba(20,26,38,.12), 0 -1px 0 rgba(20,26,38,.06); color-scheme:light; }
html:root[data-rt="sepia"]{ --bg:#F4ECD8; --ink:#3B2F22; --muted:#6E5F4B; --faint:#9A8A72; --line:#E2D6BC; --panel:#EBE1C8; --sheet:#FAF4E6;
  --hl:#F2D26B; --hl-ink:#2A2118; --good:#3C6B3F; --good-bg:#E3E8CC;
  --shade:rgba(40,30,15,.32); --lift:0 -12px 32px rgba(60,40,10,.14), 0 -1px 0 rgba(60,40,10,.08); color-scheme:light; }
html:root[data-rt="dark"]{ --bg:#15171C; --ink:#F1F2F5; --muted:#9AA0AC; --faint:#6B7280; --line:#2A2E37; --panel:#1F2229; --sheet:#1C1F26;
  --hl:rgba(255,229,102,.30); --hl-ink:#F1F2F5; --good:#5CC48B; --good-bg:#183324;
  --shade:rgba(0,0,0,.55); --lift:0 -12px 32px rgba(0,0,0,.5), 0 -1px 0 rgba(255,255,255,.05); color-scheme:dark; }
html:root[data-rf="sans"]{ --text:var(--sans); --lh:1.56; }

*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.45; touch-action:manipulation; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg); }
button{ font:inherit; color:inherit; }
[hidden]{ display:none !important; }
:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
svg{ display:block; }

/* bar */
.bar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--line); transition:transform .25s ease; user-select:none; -webkit-user-select:none; }
.bar.hide{ transform:translateY(calc(-100% - env(safe-area-inset-top,0px) - 2px)); }
.bar-in{ display:flex; align-items:center; gap:2px; height:var(--bar-h); max-width:60rem; margin-inline:auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
.bar-in .icon-btn:last-child{ margin-right:-8px; }
.back{ flex:none; border:0; background:none; padding:10px 6px 10px 0; color:var(--muted); font-size:17px; cursor:pointer; text-decoration:none; white-space:nowrap; }
.bar-title{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; border:0; background:transparent; cursor:pointer; padding:4px 6px; border-radius:10px; }
.bar-title span{ max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#t-book{ font:600 14px/1.2 var(--sans); }
#t-ch{ font:400 12.5px/1.2 var(--sans); color:var(--muted); font-variant-numeric:tabular-nums; }
.prog{ position:absolute; left:0; right:0; bottom:-1px; height:2px; }
.prog span{ display:block; height:100%; width:0; background:var(--ink); transition:width .3s ease; }
.icon-btn{ position:relative; flex:none; width:42px; height:42px; display:inline-grid; place-items:center; border:0; border-radius:12px; background:transparent; color:var(--ink); cursor:pointer; }
.icon-btn:hover, .icon-btn:active{ background:var(--panel); }
.aa{ font:600 18px/1 var(--serif); letter-spacing:-.02em; }
.aa small{ font-size:13px; }
.badge{ position:absolute; top:2px; right:-1px; min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:var(--ink); color:var(--bg); font:600 10.5px/17px var(--sans); text-align:center; font-variant-numeric:tabular-nums; }

/* reading column */
.wrap{ padding-left:max(20px, env(safe-area-inset-left,0px)); padding-right:max(20px, env(safe-area-inset-right,0px)); padding-block:0 calc(48px + env(safe-area-inset-bottom,0px)); }
.read{ max-width:var(--col); margin-inline:auto; padding-block:20px 8px; font-family:var(--text); font-size:var(--fs); line-height:var(--lh); font-optical-sizing:auto; hyphens:auto; -webkit-hyphens:auto; -webkit-tap-highlight-color:transparent; overflow-wrap:break-word; }
.read p{ margin:0; text-indent:1.2em; }
.read p.first, .read h2 + p, .read h3 + p{ text-indent:0; }
.read h2, .read h3{ font-family:var(--serif); text-wrap:balance; }
.read .h-part{ margin:1.2em 0 .1em; font:600 .68em/1.35 var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.read .h-ch{ margin:.35em 0 1em; font-size:1.75em; font-weight:600; line-height:1.15; letter-spacing:-.01em; }
.read .h-sub{ margin:1.4em 0 .6em; font-size:1.15em; font-weight:600; line-height:1.3; }
.read .loading{ color:var(--muted); font-family:var(--sans); font-size:16px; text-indent:0; padding-block:30vh; text-align:center; }
::highlight(lk){ background-color:var(--hl); color:var(--hl-ink); }
.read.pad-sheet{ padding-bottom:var(--sheet-h, 0px); }

.hint{ max-width:var(--col); margin:18px auto 0; padding:14px 16px; display:flex; flex-direction:column; align-items:flex-start; gap:10px; background:var(--panel); border-radius:14px; font-size:15.5px; line-height:1.45; }
.hint p{ margin:0; }

.chap-end{ max-width:var(--col); margin:2.4em auto 0; padding-top:20px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center; }
.chap-end .note{ width:100%; color:var(--muted); font-size:14px; }

/* buttons */
.btn{ appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:46px; padding:0 16px; border:0; border-radius:14px; background:var(--panel); color:var(--ink); font:600 16px/1.2 var(--sans); cursor:pointer; text-align:left; }
.btn.primary{ background:var(--ink); color:var(--bg); }
.btn.saved{ background:var(--good-bg); color:var(--good); }
.btn.ghost{ background:transparent; color:var(--muted); padding-inline:6px; font-weight:500; text-decoration:underline; text-underline-offset:3px; }
.btn.small{ min-height:36px; padding:0 12px; font-size:14.5px; border-radius:10px; }
.btn[disabled]{ opacity:.5; cursor:default; }

/* translation sheet */
.sheet{ position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; justify-content:center; pointer-events:none; }
.sheet-card{ pointer-events:auto; position:relative; width:100%; max-width:40rem; max-height:min(68vh, 580px); overflow:auto; overscroll-behavior:contain; background:var(--sheet); color:var(--ink); border-radius:20px 20px 0 0; box-shadow:var(--lift); padding:0 max(20px, env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px)); transform:translateY(105%); transition:transform .22s ease; }
.sheet.open .sheet-card{ transform:translateY(0); }
.sheet-top{ position:sticky; top:0; z-index:2; height:30px; margin-bottom:4px; background:var(--sheet); }
.grip{ display:flex; justify-content:center; padding:10px 0 8px; cursor:grab; touch-action:none; }
.grip span{ width:38px; height:5px; border-radius:3px; background:var(--line); }
.sheet-x{ position:absolute; top:4px; right:-12px; color:var(--muted); }
.lk{ display:flex; flex-direction:column; gap:12px; }
.lk-head{ display:flex; align-items:flex-end; gap:6px; padding-right:34px; min-width:0; }
.lk-hw{ font:600 27px/1.15 var(--serif); letter-spacing:-.01em; overflow-wrap:anywhere; }
.lk-hw.long{ font-size:19px; font-weight:400; line-height:1.4; font-style:italic; }
.lk-head .icon-btn{ margin-bottom:-6px; }
.lk-meta{ display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:-4px; color:var(--muted); font-size:15px; }
.lk-meta:empty{ display:none; }
.ipa{ font-family:"Charis SIL","Doulos SIL","Gentium Plus","Lucida Sans Unicode","Segoe UI",system-ui,sans-serif; }
.lk-main{ font:500 21px/1.35 var(--serif); }
.groups{ display:flex; flex-direction:column; gap:8px; }
.group{ display:grid; grid-template-columns:3.6em minmax(0, 1fr); gap:8px; align-items:start; }
.group.solo{ grid-template-columns:minmax(0, 1fr); }
.group-pos{ font:italic 400 15px/1.3 var(--serif); color:var(--muted); padding-top:7px; overflow-wrap:anywhere; }
.terms{ display:flex; flex-wrap:wrap; gap:6px; min-width:0; }
.term{ border:1.5px solid var(--line); background:none; border-radius:999px; padding:5px 11px; font-size:15.5px; line-height:1.2; cursor:pointer; text-align:left; }
.term.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.lk-def{ color:var(--muted); font-size:15px; line-height:1.45; }
.lk-def b{ font-weight:600; color:var(--ink); }
.lk-phr{ padding:12px 14px; border-radius:14px; background:var(--panel); display:flex; flex-direction:column; gap:8px; }
.lk-phr .t{ font-size:14px; color:var(--muted); }
.lk-phr .p{ font:600 18px/1.25 var(--serif); }
.lk-actions{ display:flex; flex-wrap:wrap; gap:8px; padding-top:2px; }
.lk-actions .btn{ min-height:44px; padding:0 14px; font-size:15px; gap:6px; }
.lk-pick{ color:var(--muted); font-size:14px; margin-top:-4px; }
.lk-sent{ border-top:1px solid var(--line); padding-top:12px; display:flex; flex-direction:column; gap:8px; }
.lk-sent .en{ font:italic 400 15.5px/1.5 var(--serif); color:var(--muted); }
.lk-sent .ru{ font-size:17px; line-height:1.5; }
.lk-links{ display:flex; gap:8px 16px; flex-wrap:wrap; font-size:14px; color:var(--faint); }
.lk-links a{ color:var(--muted); text-decoration:underline; text-underline-offset:3px; }
.lk-err{ font-size:16px; line-height:1.45; margin:0; }
.skel{ display:block; height:14px; border-radius:7px; background:var(--panel); }
.skel + .skel{ margin-top:10px; }
@media (prefers-reduced-motion: no-preference){ .skel{ animation:pulse 1.2s ease-in-out infinite; } @keyframes pulse{ 50%{ opacity:.45; } } }

.pill{ position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:45; min-height:46px; padding:0 22px; border:0; border-radius:999px; background:var(--ink); color:var(--bg); font:600 16px var(--sans); box-shadow:0 8px 24px rgba(0,0,0,.22); cursor:pointer; user-select:none; -webkit-user-select:none; white-space:nowrap; }

/* panel */
.scrim{ position:fixed; inset:0; z-index:50; background:var(--shade); }
.panel{ position:fixed; inset:0; z-index:51; display:flex; flex-direction:column; background:var(--bg); padding-top:env(safe-area-inset-top,0px); }
@media (min-width:760px){ .panel{ left:auto; width:440px; border-left:1px solid var(--line); box-shadow:-16px 0 40px rgba(0,0,0,.12); } }
.panel-head{ display:flex; align-items:center; gap:8px; min-height:56px; padding-left:max(20px, env(safe-area-inset-left,0px)); padding-right:max(10px, env(safe-area-inset-right,0px)); border-bottom:1px solid var(--line); }
.panel-head h2{ flex:1; margin:0; font:600 17px/1.2 var(--sans); }
.panel-body{ flex:1; overflow:auto; overscroll-behavior:contain; padding-left:max(20px, env(safe-area-inset-left,0px)); padding-right:max(20px, env(safe-area-inset-right,0px)); padding-block:18px calc(28px + env(safe-area-inset-bottom,0px)); }
.sec{ display:flex; flex-direction:column; gap:10px; }
.sec + .sec{ margin-top:26px; }
.label{ font:600 12px/1.3 var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--faint); }
.muted{ color:var(--muted); font-size:15px; line-height:1.45; margin:0; }

.toc-book{ font:600 23px/1.2 var(--serif); }
.toc-meta{ color:var(--muted); font-size:15px; }
.toc-group{ margin:24px 0 6px; font:600 12px/1.35 var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
.toc-list{ list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
.toc-list button{ display:flex; align-items:center; gap:10px; width:100%; min-height:48px; padding:8px 0; border:0; border-bottom:1px solid var(--line); background:transparent; text-align:left; cursor:pointer; font-size:17px; }
.toc-list button .t{ flex:1; min-width:0; }
.toc-list button .n{ color:var(--faint); font-size:14px; font-variant-numeric:tabular-nums; }
.toc-list button.cur .t{ font-weight:600; }
.toc-list button.cur .t::before{ content:""; display:inline-block; width:8px; height:8px; margin-right:8px; border-radius:50%; background:var(--hl-solid, #F2CF3B); vertical-align:1px; }
.toc-list button.read .t{ color:var(--muted); }

.book{ display:flex; gap:14px; align-items:stretch; padding:14px; border:1.5px solid var(--line); border-radius:16px; }
.book.cur{ border-color:var(--ink); }
.cover{ flex:none; width:64px; min-height:92px; border-radius:5px 9px 9px 5px; padding:8px 7px; display:flex; flex-direction:column; justify-content:space-between; background:var(--ink); color:var(--bg); box-shadow:inset 4px 0 0 rgba(128,128,128,.35); overflow:hidden; }
.cover b{ font:600 11px/1.15 var(--serif); overflow-wrap:anywhere; }
.cover i{ font:400 9px/1.2 var(--sans); font-style:normal; opacity:.8; }
.cover.alt{ background:var(--panel); color:var(--ink); }
.book-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
.book-title{ font:600 17px/1.25 var(--serif); }
.book-sub{ color:var(--muted); font-size:14px; }
.book-prog{ margin-top:auto; display:flex; align-items:center; gap:10px; padding-top:8px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
.bar-mini{ flex:1; height:4px; border-radius:2px; background:var(--panel); overflow:hidden; }
.bar-mini span{ display:block; height:100%; background:var(--ink); }
.book-actions{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:6px; }

.w-list{ list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
.w-item{ display:flex; gap:6px; padding:14px 0; border-bottom:1px solid var(--line); }
.w-body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.w-top{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 8px; }
.w-en{ font:500 19px/1.2 var(--serif); }
.w-pos{ color:var(--muted); font:italic 400 14px var(--serif); }
.w-ru{ font-size:16px; }
.w-ex{ font:italic 400 14.5px/1.45 var(--serif); color:var(--muted); }
.w-src{ color:var(--faint); font-size:13px; }
.w-item .icon-btn{ color:var(--muted); }
.callout{ padding:14px 16px; border-radius:14px; background:var(--panel); font-size:15.5px; line-height:1.45; display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
.empty{ padding:28px 4px; color:var(--muted); text-align:center; font-size:16px; line-height:1.5; }

.seg{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; }
.seg button{ display:flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 10px; border:1.5px solid var(--line); border-radius:14px; background:none; cursor:pointer; font-size:15.5px; white-space:nowrap; }
.seg button[aria-pressed="true"]{ border-color:var(--ink); background:var(--ink); color:var(--bg); font-weight:600; }
.sw{ flex:none; width:16px; height:16px; border-radius:50%; border:1px solid var(--faint); }
.size-row{ display:flex; align-items:center; gap:10px; }
.size-row .val{ flex:1; text-align:center; font-variant-numeric:tabular-nums; color:var(--muted); }
.preview{ padding:14px 16px; border-radius:14px; border:1.5px solid var(--line); font-family:var(--text); font-size:var(--fs); line-height:var(--lh); }

.toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:70; width:max-content; max-width:min(calc(100vw - 32px), 30rem); display:flex; align-items:center; gap:12px; padding:11px 16px; border-radius:12px; background:var(--ink); color:var(--bg); font-size:15px; line-height:1.4; box-shadow:0 10px 30px rgba(0,0,0,.25); }
.toast button{ flex:none; border:0; background:transparent; color:var(--bg); font-weight:600; text-decoration:underline; cursor:pointer; padding:4px; }

@media (prefers-reduced-motion: reduce){ .bar, .sheet-card, .prog span{ transition:none; } }
@media (min-width:760px){ :root{ --fs:19.5px; } .read{ padding-top:36px; } }
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="bar-in">
    <a class="back" id="back" href="./">‹ Слова</a>
    <button class="bar-title" id="btn-title" type="button" aria-label="Оглавление"><span id="t-book">Чтение</span><span id="t-ch">Открываю книгу…</span></button>
    <button class="icon-btn" id="btn-toc" type="button" aria-label="Оглавление"></button>
    <button class="icon-btn" id="btn-set" type="button" aria-label="Размер шрифта и тема"><span class="aa">A<small>a</small></span></button>
    <button class="icon-btn" id="btn-words" type="button" aria-label="Мои слова"><span class="badge" id="w-count" hidden>0</span></button>
  </div>
  <div class="prog"><span id="prog"></span></div>
</header>

<main class="wrap" id="main">
  <div class="hint" id="hint" hidden>
    <p id="hint-text"></p>
    <button class="btn small" id="hint-ok" type="button">Понятно</button>
  </div>
  <article class="read" id="read" lang="en"><p class="loading">Открываю книгу…</p></article>
  <nav class="chap-end" id="chap-end" aria-label="Переход по главам" hidden></nav>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" id="sheet-card" role="dialog" aria-label="Перевод">
    <div class="sheet-top"><div class="grip" id="grip"><span></span></div><button class="icon-btn sheet-x" id="sheet-x" type="button" aria-label="Закрыть перевод"></button></div>
    <div class="lk" id="lk"></div>
  </div>
</div>
<button class="pill" id="pill" type="button" hidden>Перевести выделенное</button>
<div class="scrim" id="scrim" hidden></div>
<section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden>
  <div class="panel-head"><h2 id="panel-title"></h2><button class="icon-btn" id="panel-x" type="button" aria-label="Закрыть"></button></div>
  <div class="panel-body" id="panel-body"></div>
</section>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="file" hidden>

<script>
(() => {
'use strict';

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);

    else n.setAttribute(k, v === true ? '' : v);

const idb = (() => {

  } catch (e) {
    const code = e && e.code;
    toast(code === 'drm' ? 'Эта книга защищена от копирования (DRM). Такие файлы открываются только в приложении магазина.'
      : code === 'unsupported' ? 'Этот формат не поддерживается. Подходят EPUB, FB2 и TXT.'
      : code === 'empty' ? 'В файле не нашлось текста.'
      : 'Не получилось прочитать файл. Подходят EPUB, FB2 и TXT.', null, 6000);
  }
});

function renderWords() {
  el.pTitle.textContent = 'Мои слова';
  el.pBody.textContent = '';
  const items = Object.entries(W.all()).sort((a, b) => String(b[1].added || '').localeCompare(String(a[1].added || '')));
  const copy = h('button', { class: 'btn small', type: 'button' }, h('span', { svg: I.copy }), 'Скопировать список для Claude');
  copy.addEventListener('click', () => {
    const text = 'Добавь в мой словарь slova слова из книги (с синонимами, по правилам README):\n' + items.map(([, d]) => '- ' + d.en + ' — ' + d.ru + (d.ex ? ' — «' + d.ex + '»' : '') + (d.book ? ' [' + d.book + ']' : '')).join('\n');
    const done = () => { copy.textContent = 'Скопировано'; };
    try { navigator.clipboard.writeText(text).then(done, () => toast('Не получилось скопировать.')); } catch (e) { toast('Не получилось скопировать.'); }
  });
  el.pBody.append(h('div', { class: 'callout' },
    h('div', { text: 'Эти слова уже в тренажёре: на главной «Слов» выбери набор «Из книг». Если хочешь, чтобы Claude добавил их в общий словарь с синонимами, скопируй список и пришли ему в чат.' }),
    items.length ? copy : null));
  if (!items.length) { el.pBody.append(h('div', { class: 'empty', text: 'Пока пусто. Коснись слова в тексте, выбери подходящее значение и нажми «В словарь».' })); return; }
  el.pBody.append(h('div', { class: 'label', style: 'margin:22px 0 8px', text: items.length + ' ' + plural(items.length, 'слово', 'слова', 'слов') }));
  const ul = h('ul', { class: 'w-list' });
  for (const [id, d] of items) {
    ul.append(h('li', { class: 'w-item' },
      h('div', { class: 'w-body' },
        h('div', { class: 'w-top' }, h('span', { class: 'w-en', text: d.en || id }), d.pos ? h('span', { class: 'w-pos', text: d.pos }) : null),
        d.ru ? h('div', { class: 'w-ru', text: d.ru }) : null,
        d.ex ? h('div', { class: 'w-ex', text: d.ex }) : null,
        h('div', { class: 'w-src', text: [d.book, d.ch].filter(Boolean).join(' · ') })),
      speakBtn(d.en || ''),
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Убрать слово', svg: I.trash, onclick: () => {
        const keep = Object.assign({}, d);
        W.remove(id);
        toast('«' + (d.en || id) + '» убрано.', { label: 'Вернуть', run: () => W.put(id, keep) });
      } })));
  }
  el.pBody.append(ul);
}

function renderSettings() {
  el.pTitle.textContent = 'Текст';
  el.pBody.textContent = '';
  const idx = curSizeIndex();
  const val = h('span', { class: 'val', text: SIZES[idx] + ' px' });
  const setSize = d => { const i = Math.min(SIZES.length - 1, Math.max(0, curSizeIndex() + d)); S.set.size = i; saveSettings(); val.textContent = SIZES[i] + ' px'; keepSpot(); };
  const seg = (items, key) => h('div', { class: 'seg' }, items.map(([v, label, sw]) => h('button', {
    type: 'button', 'aria-pressed': S.set[key] === v ? 'true' : 'false',
    onclick: () => { S.set[key] = v; saveSettings(); keepSpot(); renderSettings(); },
  }, sw ? h('span', { class: 'sw', style: 'background:' + sw }) : null, label)));
  el.pBody.append(
    h('div', { class: 'sec' }, h('div', { class: 'label', text: 'Размер' }),
      h('div', { class: 'size-row' },
        h('button', { class: 'btn', type: 'button', 'aria-label': 'Меньше', onclick: () => setSize(-1) }, h('span', { class: 'aa', text: 'A−' })),
        val,
        h('button', { class: 'btn', type: 'button', 'aria-label': 'Больше', onclick: () => setSize(1) }, h('span', { class: 'aa', style: 'font-size:22px', text: 'A+' })))),
    h('div', { class: 'sec' }, h('div', { class: 'label', text: 'Шрифт' }), seg([['serif', 'С засечками'], ['sans', 'Без засечек']], 'font')),
    h('div', { class: 'sec' }, h('div', { class: 'label', text: 'Тема' }), seg([['auto', 'Как в телефоне', 'linear-gradient(90deg, #FFFFFF 50%, #15171C 50%)'], ['light', 'Светлая', '#FFFFFF'], ['sepia', 'Сепия', '#F4ECD8'], ['dark', 'Тёмная', '#15171C']], 'theme')),
    h('div', { class: 'sec' }, h('div', { class: 'label', text: 'Так выглядит текст' }),
      h('div', { class: 'preview', lang: 'en', text: 'The balloon, now a mere plaything of the storm, was driven across the sky at a speed of ninety miles an hour.' })));
}
function keepSpot() { const p = S.para, o = S.off; requestAnimationFrame(() => scrollToSpot(p, o)); }

/* ================= hint ================= */
if (!LS.get('hintDone', false)) {
  $('#hint-text').textContent = 'Коснись незнакомого слова, и появится перевод. Чтобы перевести фразу, выдели её и нажми «Перевести выделенное». Сохранённые слова попадут в тренажёр, в набор «Из книг».';
  el.hint.hidden = false;
}
$('#hint-ok').addEventListener('click', () => { el.hint.hidden = true; LS.set('hintDone', true); });

/* ================= boot ================= */
applySettings();
refreshWords();
(async () => {
  try { await openBook(LS.get('last', BUNDLED[0].id)); }
  catch (e) {
    try { await openBook(BUNDLED[0].id); }
    catch (e2) { el.read.textContent = ''; el.read.append(h('p', { class: 'loading', text: 'Не удалось загрузить книгу. Проверь интернет и обнови страницу.' })); el.tCh.textContent = ''; }
  }
})();
window.ReaderDebug = { parseBuffer, state: S, words: W, phrasalOf };
})();
</script>
</body>
</html>
