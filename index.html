<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Слова">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon.png">
<title>Слова</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400;1,7..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#141A26; --muted:#6B7280; --line:#E6E8EE; --panel:#F3F4F7;
  --hl:#FFE566; --hl-solid:#F2CF3B;
  --good:#1E7F4B; --good-bg:#E4F4EA; --bad:#B8322A; --bad-bg:#F9E5E3;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15171C; --ink:#F1F2F5; --muted:#9AA0AC; --line:#2A2E37; --panel:#1F2229;
    --hl:rgba(255,229,102,.28); --hl-solid:#D9B92E;
    --good:#5CC48B; --good-bg:#183324; --bad:#F0776C; --bad-bg:#3A1F1C; }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:0 20px calc(20px + env(safe-area-inset-bottom))}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:56px;padding-top:env(safe-area-inset-top)}
header[hidden]{display:none}
header .hbtn{justify-self:start;background:none;border:0;padding:10px 0;font-size:17px;cursor:pointer;color:var(--muted)}
header .ttl{font-weight:600}
header .counter{justify-self:end;color:var(--muted);font-variant-numeric:tabular-nums}
main{flex:1;display:flex;flex-direction:column}
@media (prefers-reduced-motion:no-preference){
  main.fade{animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}

/* home */
h1.brand{font-family:var(--serif);font-weight:600;font-size:36px;letter-spacing:-.01em;margin:36px 0 10px}
p.lead{font-family:var(--serif);font-size:20px;line-height:1.45;margin:0 0 30px;max-width:34ch}
.modes{border-top:1px solid var(--line)}
.mode{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 0;cursor:pointer}
.mode .t{font-size:18px;font-weight:600}
.mode .d{color:var(--muted);font-size:15px;margin-top:2px}
.mode .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:12px;white-space:nowrap}
.mode:disabled{opacity:.45;cursor:default}
.links{display:flex;gap:22px;margin-top:22px}
.links button{background:none;border:0;padding:0;color:var(--muted);font-size:16px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.packs{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 22px;padding:0 20px 4px;scrollbar-width:none}
.packs::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:none;border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{opacity:.6;margin-left:6px;font-variant-numeric:tabular-nums}
.chip.lvl{font-variant-numeric:tabular-nums}
.packs.sub{margin-top:-12px}
.packs.sub .chip{padding:6px 12px;font-size:14px}
.note{color:var(--muted);text-align:center;font-size:15px;line-height:1.45;margin:10px 0 0}
.res{list-style:none;margin:18px 0 0;padding:0}
.res li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.res li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.res .up{color:var(--good)} .res .down{color:var(--bad)}
h2.sec{font-family:var(--serif);font-weight:600;font-size:22px;margin:30px 0 0}
.sent{font-family:var(--serif);font-size:clamp(21px,5.6vw,26px);line-height:1.45;margin:0;text-align:center;overflow-wrap:anywhere}
.sent .blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--ink);height:1em;vertical-align:baseline}
.sent .hint{color:var(--muted);font-style:italic;font-size:.78em}
.sent mark{background:var(--hl);color:inherit;padding:0 .15em;border-radius:2px}
.why{color:var(--muted);text-align:center;font-size:16px;line-height:1.5;margin:12px 0 0}
.task{color:var(--muted);text-align:center;font-size:15px;margin:0 0 6px}
.answer{min-height:60px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px;border:1.5px dashed var(--line);border-radius:14px;margin-top:18px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.tok{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-family:var(--serif);font-size:19px;cursor:pointer}
.answer .tok{background:var(--bg)}
.intro{margin:22px 0 0;padding:0;list-style:none}
.intro li{padding:9px 0;border-bottom:1px solid var(--line);font-size:16px;line-height:1.45}
.intro li b{font-family:var(--serif);font-weight:600;font-size:17px}
.intro li i{font-family:var(--serif)}
textarea.input{resize:none;text-align:left;font-size:19px;line-height:1.4;padding:12px 14px;font-family:var(--serif)}

/* session */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0 16px}
.tapzone{cursor:pointer}
.pos{text-align:center;color:var(--muted);font-size:15px;margin:0 0 12px;font-style:italic;font-family:var(--serif)}
.word{font-family:var(--serif);font-weight:500;font-size:clamp(34px,10vw,46px);line-height:1.15;margin:0;text-align:center;letter-spacing:-.01em;overflow-wrap:anywhere}
.word mark{background:var(--hl);color:inherit;padding:.04em .18em;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.word.ruq{font-size:clamp(24px,6.5vw,30px);font-weight:500;line-height:1.3}
.speak{display:block;margin:18px auto 0;background:var(--panel);border:0;border-radius:999px;width:46px;height:46px;font-size:20px;cursor:pointer}
.ru{font-family:var(--serif);font-size:24px;line-height:1.35;text-align:center;margin:30px 0 12px}
.ex{color:var(--muted);text-align:center;font-size:17px;line-height:1.5;margin:0}
.ex em{font-style:normal;background:var(--hl);color:var(--ink);padding:0 .12em;border-radius:2px}
.hint{color:var(--muted);text-align:center;margin:38px 0 0;font-size:15px}
.actions{display:flex;gap:12px;margin-top:18px}
.btn{flex:1;min-height:56px;border:0;border-radius:14px;font-size:18px;font-weight:600;cursor:pointer;background:var(--panel);color:var(--ink);padding:0 14px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.good{background:var(--good-bg);color:var(--good)}
.btn.bad{background:var(--bad-bg);color:var(--bad)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}

.opts{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.opt{min-height:56px;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:none;font-size:17px;line-height:1.35;cursor:pointer}
.opt.correct{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt:disabled{cursor:default}
#after{margin-top:20px}

.input{width:100%;min-height:56px;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;font-size:20px;font-family:var(--serif);color:var(--ink);background:var(--bg);margin-top:24px;text-align:center}
.input:focus{outline:none;border-color:var(--ink)}
.input:disabled{opacity:.7}
.verdict{text-align:center;font-weight:600;margin:16px 0 0;min-height:1.4em}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.verdict b{font-family:var(--serif);font-weight:600;font-size:20px}

/* summary, list, settings */
.summary h2{font-family:var(--serif);font-weight:600;font-size:34px;margin:28px 0 6px}
.wrongs,.wl{list-style:none;margin:16px 0 0;padding:0}
.wrongs li,.wl li{padding:12px 0;border-bottom:1px solid var(--line)}
.e{font-family:var(--serif);font-size:19px;display:flex;align-items:center;gap:8px}
.r{color:var(--muted);font-size:15px;margin-top:2px}
.r.x{font-style:italic}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.learn{background:var(--hl-solid)} .dot.done{background:var(--good)}
.search{margin-top:8px;text-align:left;font-family:var(--sans);font-size:17px}
.legend{display:flex;gap:16px;align-items:center;color:var(--muted);font-size:14px;margin:12px 0 0}
.legend span{display:flex;align-items:center;gap:6px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--panel);border-radius:10px;padding:3px}
.seg button{border:0;background:none;font-size:15px;padding:6px 10px;border-radius:8px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
textarea{width:100%;min-height:110px;margin-top:12px;font:13px/1.4 ui-monospace,Menlo,monospace;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)}
.small{color:var(--muted);font-size:14px;line-height:1.45}
p.small{margin:20px 0 0}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:15px;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app">
  <header id="hdr" hidden>
    <button class="hbtn" id="back">‹ Назад</button>
    <span class="ttl" id="title"></span>
    <span class="counter" id="right"></span>
  </header>
  <main id="screen"><p class="small" style="margin-top:40px">Загружаю слова…</p></main>
</div>

<script>
// ---------- words: loaded from words.json next to this file; this list is a fallback ----------
const WORDS_FALLBACK = [
{id:"w0001",en:"elaborate",pos:"verb",ru:"подробно объяснять, развивать мысль",ex:"Could you elaborate on your plan?"},
{id:"w0002",en:"reluctant",pos:"adjective",ru:"неохотный; делающий что-то без желания",ex:"She was reluctant to sign the contract."},
{id:"w0003",en:"overwhelming",pos:"adjective",ru:"подавляющий, ошеломляющий",ex:"The support we received was overwhelming."},
{id:"w0004",en:"come across",pos:"phrasal verb",ru:"случайно наткнуться, встретить",ex:"I came across an old photo yesterday."},
{id:"w0005",en:"figure out",pos:"phrasal verb",ru:"понять, разобраться",ex:"I can't figure out how this works."},
{id:"w0006",en:"deadline",pos:"noun",ru:"крайний срок",ex:"The deadline is on Friday."},
{id:"w0007",en:"thorough",pos:"adjective",ru:"тщательный, доскональный",ex:"They did a thorough check of the engine."},
{id:"w0008",en:"put off",pos:"phrasal verb",ru:"откладывать",ex:"Don't put off the visit to the dentist."},
{id:"w0009",en:"eventually",pos:"adverb",ru:"в конечном счёте, со временем",ex:"He eventually agreed to help."},
{id:"w0010",en:"genuine",pos:"adjective",ru:"подлинный, искренний",ex:"It was a genuine mistake."},
{id:"w0011",en:"take for granted",pos:"idiom",ru:"принимать как должное",ex:"We take clean water for granted."},
{id:"w0012",en:"commute",pos:"verb / noun",ru:"ездить на работу и обратно; такая поездка",ex:"My commute takes forty minutes."},
{id:"w0013",en:"subtle",pos:"adjective",ru:"едва заметный, тонкий",ex:"There's a subtle difference between the two."},
{id:"w0014",en:"keep up with",pos:"phrasal verb",ru:"поспевать, не отставать",ex:"It's hard to keep up with the news."},
{id:"w0015",en:"bargain",pos:"noun / verb",ru:"выгодная покупка; торговаться",ex:"That jacket was a real bargain."}
];

// ---------- storage (falls back to memory where localStorage is unavailable) ----------
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e) { return mem[k] ?? null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e) { mem[k]=v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e) { delete mem[k]; } }
};
const DAY = 86400000;
const INTERVALS = [0, 1, 3, 7, 14, 30]; // days until next review, by box
const TOPICS = {build:'Архитектура и строительство', acad:'Академическая лексика', sci:'Наука и технологии', edu:'Образование', soc:'Общество и культура', eco:'Экология', health:'Здоровье', work:'Работа и бизнес', city:'Города и жильё', travel:'Путешествия', home:'Дом, еда и быт', nature:'Природа и животные', talk:'Разговорное'};
const LEVELS = ['B1','B2','C1'];

let words = [], source = '', sets = [];
let progress = safeJSON(store.get('ew_progress'), {});
let settings = Object.assign({dir:'en-ru', size:20, pack:'all'}, safeJSON(store.get('ew_settings'), {}));
let session = null;

function safeJSON(s, d){ try { const v = JSON.parse(s); return v && typeof v==='object' ? v : d; } catch(e) { return d; } }
function saveP(){ store.set('ew_progress', JSON.stringify(progress)); }
function saveS(){ store.set('ew_settings', JSON.stringify(settings)); }

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function plural(n,a,b,c){ n=Math.abs(n)%100; const k=n%10; if(n>10&&n<20) return c; if(k>1&&k<5) return b; if(k===1) return a; return c; }
function speak(t){ try { const u = new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=0.95; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e) {} }
function toast(msg){ let t=$('#toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); } t.textContent=msg; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),1800); }

const SKIP = new Set(['to','a','an','the']);
function tokens(en, min){ return en.toLowerCase().replace(/\(.*?\)/g,'').split(/[\s\/,;]+/).filter(t => t.length>=min && !SKIP.has(t)); }
function pattern(en, min){
  const parts = tokens(en,min).map(t => { const e=t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); return t.length>=5 ? '\\b'+e.slice(0,t.length-2)+'\\w*' : '\\b'+e+'\\b'; });
  return parts.length ? new RegExp(parts.join('|'),'gi') : null;
}
const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
// matches a multi-word entry inside an example, allowing inflection and an optional object for (sb)
function phraseRe(variant){
  let v = variant.replace(/…|\.\.\./g,' ').replace(/\+\s*-ing/g,' ')
    .replace(/\((?:sb|sth|smb|someone|something)\)/gi,' SB ').replace(/\(.*?\)/g,' ').trim().replace(/^(be|to)\s+/i,'');
  const ws = v.split(/\s+/).filter(Boolean);
  while(ws.length && ws[ws.length-1]==='SB') ws.pop();
  if(ws.filter(w=>w!=='SB').length<2) return null;
  let src='\\b';
  ws.forEach((w,i)=>{
    const last = i===ws.length-1;
    if(w==='SB'){ src+='(?:\\S+[\\s-]+)?'; return; }
    src += (w.length>=4 ? reEsc(w[0])+'[\\w\']*' : reEsc(w)) + (last ? '\\b' : '[\\s-]+');
  });
  return new RegExp(src,'i');
}
function findPhrase(ex, en){
  for(const v of en.split(/\s*[\/;]\s*/)){ const re=phraseRe(v); if(!re) continue; const m=ex.match(re); if(m) return m; }
  return null;
}
function hl(ex, en){
  const m=findPhrase(ex,en);
  if(m) return esc(ex.slice(0,m.index))+`<em>${esc(m[0])}</em>`+esc(ex.slice(m.index+m[0].length));
  const p=pattern(en,3), s=esc(ex); return p ? s.replace(p, x=>`<em>${x}</em>`) : s;
}
function blank(ex, en){
  const m=findPhrase(ex,en);
  if(m) return esc(ex.slice(0,m.index))+'___'+esc(ex.slice(m.index+m[0].length));
  const multi = en.replace(/\(.*?\)/g,'').trim().split(/\s+/).length>1;
  const p=pattern(en, multi?4:2), s=esc(ex); return p ? s.replace(p,'___') : s;
}

function norm(s){
  return s.toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z0-9' -]/g,'').replace(/\s+/g,' ').trim()
    .replace(/^(to|be)\s+/,'').replace(/^(a|an|the)\s+/,'').replace(/\b(sb|sth|smb|smth|someone|something|somebody)\b/g,'').replace(/\s+/g,' ').trim();
}
function lev(a,b){ if(a===b) return 0; const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=Array.from({length:n+1},(_,i)=>i); for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; } return prev[n]; }
function grade(val, target){
  const v = norm(val); if(!v) return 'no';
  const variants = target.split(/[\/;]/).map(norm).filter(Boolean);
  if(variants.includes(v)) return 'ok';
  for(const t of variants){ if(t.length>=5 && lev(v,t)<=1) return 'near'; }
  return 'no';
}

// ---------- packs (filters by topic or level) ----------
const LESSON_TAG = 'уроки';

function conds(p=settings.pack){ return (!p||p==='all') ? [] : p.split('|').map(c=>{ const i=c.indexOf(':'); return [c.slice(0,i), c.slice(i+1)]; }); }
function matches(w, [t,k]){ return t==='topic' ? w.topic===k : t==='level' ? w.level===k : t==='tag' ? (w.tags||[]).includes(k) : true; }
function inPack(w){ return conds().every(c=>matches(w,c)); }
function pool(){ return words.filter(inPack); }
function condLabel([t,k]){ return t==='topic' ? (TOPICS[k]||k) : k; }
function packLabel(){ return conds().map(condLabel).join(' · '); }
function meta(w){ return [w.pos, w.level].filter(Boolean).join(', '); }

// ---------- progress ----------
function rec(id){ return progress[id] || (progress[id] = {box:0,due:0,seen:0,ok:0,bad:0,last:0}); }
function status(w){ const r=progress[w.id]; if(!r||!r.seen) return 'new'; return r.box>=4 ? 'done' : 'learn'; }
function isDue(w){ const r=progress[w.id]; return !!(r && r.seen && r.due<=Date.now()); }
function isError(w){ const r=progress[w.id]; return !!(r && r.bad>0 && r.box<3); }
function mark(id, ok){
  const r=rec(id); r.seen++; r.last=Date.now();
  if(ok){ r.ok++; r.box=Math.min(r.box+1,5); r.due=Date.now()+INTERVALS[r.box]*DAY; }
  else { r.bad++; r.box=0; r.due=Date.now(); }
  saveP();
}
function stats(arr=pool()){
  const s={total:arr.length,fresh:0,due:0,done:0,err:0};
  for(const w of arr){ const st=status(w); if(st==='new') s.fresh++; if(st==='done') s.done++; if(isDue(w)) s.due++; if(isError(w)) s.err++; }
  return s;
}

// ---------- data ----------
async function loadWords(){
  try{
    const r = await fetch('words.json?v='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    if(!Array.isArray(j) || !j.length) throw new Error('empty');
    words = j; source = 'words.json';
  } catch(e){ words = WORDS_FALLBACK; source = 'встроенный список (words.json не найден)'; }
  words.forEach((w,i)=>{ if(!w.id) w.id='w'+i; });
  if(settings.pack!=='all' && (!pool().length || conds().some(([t])=>t==='tag' && settings.pack.indexOf('|')<0))){ settings.pack='all'; saveS(); }
  try{
    const r = await fetch('exercises.json?v='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const j = await r.json(); sets = Array.isArray(j) ? j : [];
  } catch(e){ sets = []; }
  sets.forEach(st=>st.items.forEach((it,i)=>{ if(!it.id) it.id=st.id+'-'+i; }));
}

// ---------- rendering ----------
function render(html, {title='', back=null, right='', header=true}={}){
  const h=$('#hdr'); h.hidden=!header;
  $('#title').textContent=title;
  const b=$('#back'); b.style.visibility = back ? 'visible' : 'hidden'; b.onclick = back;
  $('#right').textContent=right;
  const m=$('#screen'); m.innerHTML=html; m.classList.remove('fade'); void m.offsetWidth; m.classList.add('fade');
  window.scrollTo(0,0);
}

function home(){
  session=null;
  const s=stats();
  const lbl=packLabel();
  const lead = !words.length
    ? 'Список слов пока пуст. Пришли первые слова — и они появятся здесь.'
    : `${lbl ? `«${lbl}»` : 'Всего'} ${s.total} ${plural(s.total,'слово','слова','слов')}: ${s.fresh} ещё не открывал, ${s.due} ${plural(s.due,'ждёт','ждут','ждут')} повторения сегодня, ${s.done} выучено.`;
  const tc={}, lc={};
  for(const w of words){ if(w.topic) tc[w.topic]=(tc[w.topic]||0)+1; if(w.level) lc[w.level]=(lc[w.level]||0)+1; }
  const cs=conds(), base = cs.length ? cs[0].join(':') : 'all';
  const chip=(v,l,n,on,cls='')=>`<button class="chip ${cls} ${on?'on':''}" data-p="${esc(v)}">${esc(l)}${n!=null?`<span class="c">${n}</span>`:''}</button>`;
  const chips = [chip('all','Все слова',words.length,base==='all')]
    .concat(Object.keys(TOPICS).filter(k=>tc[k]).map(k=>chip('topic:'+k,TOPICS[k],tc[k],base==='topic:'+k)))
    .concat(LEVELS.filter(l=>lc[l]).map(l=>chip('level:'+l,l,lc[l],base==='level:'+l,'lvl')));
  let sub=[];
  if(cs.length && cs[0][0]!=='level'){
    const inBase = words.filter(w=>matches(w,cs[0])), cnt={};
    for(const w of inBase) for(const t of (w.tags||[])) if(t!==cs[0][1]) cnt[t]=(cnt[t]||0)+1;
    const ORDER=['АР','ГП','Конструктив','Материалы','ОВ','ВК','Электрика','Организация'];
    const rank=t=>{ const i=ORDER.indexOf(t); return i<0?99:i; };
    const tags=Object.keys(cnt).sort((a,b)=>rank(a)-rank(b));
    if(tags.length>1) sub=[chip(base,'Все',inBase.length,cs.length===1)].concat(tags.map(t=>chip(base+'|tag:'+t,t,cnt[t],settings.pack===base+'|tag:'+t)));
  }
  const row=(k,t,d,n,dis)=>`<button class="mode" data-m="${k}" ${dis?'disabled':''}><span><span class="t">${t}</span><br><span class="d">${d}</span></span>${n!=null?`<span class="n">${n}</span>`:''}</button>`;
  render(`
    <h1 class="brand">Слова</h1>
    <p class="lead">${lead}</p>
    ${words.length ? `<div class="packs">${chips.join('')}</div>` : ''}
    ${sub.length ? `<div class="packs sub">${sub.join('')}</div>` : ''}
    <div class="modes">
      ${row('cards','Карточки','смотри слово, вспоминай перевод')}
      ${row('test','Выбор из четырёх','узнай перевод среди вариантов')}
      ${row('write','Письмо','напиши слово по переводу')}
      ${row('errors','Ошибки','только слова, где ошибался', s.err, !s.err)}
    </div>
    ${setsHtml()}
    <div class="links"><button id="lnk-list">Все слова</button><button id="lnk-set">Настройки</button></div>
  `, {header:false});
  document.querySelectorAll('.mode[data-set]').forEach(b=>b.onclick=()=>{ const st=sets.find(x=>x.id===b.dataset.set); if(st) openSet(st); });
  document.querySelectorAll('.mode[data-m]').forEach(b=>b.onclick=()=>start(b.dataset.m));
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ settings.pack=b.dataset.p; saveS(); home(); });
  $('#lnk-list').onclick=list; $('#lnk-set').onclick=settingsScreen;
}

const TITLES = {cards:'Карточки', test:'Выбор из четырёх', write:'Письмо'};
function sessionOpts(){
  const ex = session.kind==='ex' || session.kind==='test';
  return {title: ex ? (session.set.short||session.set.title) : TITLES[session.mode], back: ex ? ()=>openSet(session.set) : home, right:`${Math.min(session.i+1,session.queue.length)} / ${session.queue.length}`};
}

function start(mode){
  const P=pool();
  if(!P.length){ toast('Слов пока нет'); return; }
  let list_, errorsOnly=false;
  if(mode==='errors'){ list_=shuffle(P.filter(isError)); mode='test'; errorsOnly=true; if(!list_.length){ toast('Ошибок пока нет'); return; } }
  else {
    const due=shuffle(P.filter(isDue));
    const fresh=shuffle(P.filter(w=>status(w)==='new'));
    const rest=shuffle(P.filter(w=>!isDue(w)&&status(w)!=='new'));
    list_=[...due,...fresh,...rest];
  }
  const queue=shuffle(list_.slice(0, errorsOnly ? list_.length : settings.size));
  session={kind:'words', mode, queue, i:0, first:{}, wrong:[], retried:new Set()};
  next();
}
function next(){
  if(session.i>=session.queue.length) return summary();
  const w=session.queue[session.i];
  if(session.kind==='ex' || session.kind==='test') return exScreen(w);
  ({cards:cardScreen, test:testScreen, write:writeScreen})[session.mode](w);
}
function record(w, ok){
  if(session.kind==='test'){ if(!(w.id in session.first)){ session.first[w.id]=ok; if(!ok) session.wrong.push(w); } return; }
  mark(w.id, ok);
  if(!(w.id in session.first)) session.first[w.id]=ok;
  if(!ok){
    if(!session.wrong.includes(w)) session.wrong.push(w);
    if(!session.retried.has(w.id)){ session.retried.add(w.id); session.queue.push(w); }
  }
}
function advance(){ session.i++; next(); }
function nextButton(){ $('#acts').innerHTML=`<button class="btn primary" id="nxt">Дальше</button>`; $('#nxt').onclick=advance; }

function cardScreen(w){
  render(`
    <div class="stage tapzone" id="stage">

function testScreen(w){
  const dir = settings.dir==='mix' ? (Math.random()<.5?'en-ru':'ru-en') : settings.dir;
  const key = dir==='en-ru' ? 'ru' : 'en';
  const q = dir==='en-ru' ? w.en : w.ru;
  const pool = words.filter(x=>x.id!==w.id && x[key]!==w[key]);
  const same = pool.filter(x=>x.pos && x.pos===w.pos && (!w.topic || x.topic===w.topic));
  let ds = shuffle(same).slice(0,3);
  if(ds.length<3) ds = ds.concat(shuffle(pool.filter(x=>!ds.includes(x) && x.pos && x.pos===w.pos)).slice(0,3-ds.length));
  if(ds.length<3) ds = ds.concat(shuffle(pool.filter(x=>!ds.includes(x))).slice(0,3-ds.length));
  const opts = shuffle([w,...ds]);
  render(`
    <div class="stage">
      ${dir==='en-ru'&&meta(w)?`<p class="pos">${esc(meta(w))}</p>`:''}
      <h2 class="word ${dir==='ru-en'?'ruq':''}"><mark>${esc(q)}</mark></h2>
      ${dir==='en-ru'?`<button class="speak" id="speak" aria-label="Произнести">🔊</button>`:''}
      <div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}">${esc(o[key])}</button>`).join('')}</div>
      <div id="after"></div>
    </div>
    <div class="actions" id="acts"></div>
  `, sessionOpts());
  const sp=$('#speak'); if(sp) sp.onclick=()=>speak(w.en);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok = b.dataset.id===w.id;
    document.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(x.dataset.id===w.id) x.classList.add('correct'); });
    if(!ok) b.classList.add('wrong');
    record(w, ok);
    if(dir==='ru-en') speak(w.en);
    $('#after').innerHTML = (w.ex ? `<p class="ex">${hl(w.ex,w.en)}</p>` : '') + (w.note ? `<p class="note">${esc(w.note)}</p>` : '');
    nextButton();
  });
}

function writeScreen(w){
  render(`
    <div class="stage">
      ${meta(w)?`<p class="pos">${esc(meta(w))}</p>`:''}
      <h2 class="word ruq">${esc(w.ru)}</h2>
      ${w.ex?`<p class="ex" style="margin-top:14px">${blank(w.ex,w.en)}</p>`:''}
      <input class="input" id="inp" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="по-английски" enterkeyhint="done">
      <p class="verdict" id="verdict"></p><p class="note" id="wnote"></p>
    </div>

  `, sessionOpts());

    if(done || !inp.value.trim()) return; done=true;

// ---------- exercise engine: gap / choice / fix / order ----------
const TYPE_LABEL = {gap:'Раскрой скобки', choice:'Выбери форму', fix:'Исправь ошибку', order:'Собери предложение'};
function normAns(s, cs){
  let t=String(s||''); if(!cs) t=t.toLowerCase();
  return t.replace(/[’‘`]/g,"'").replace(/\b(can't|cannot)\b/gi,'can not').replace(/\bwon't\b/gi,'will not').replace(/n't\b/g,' not').replace(/'ll\b/g,' will').replace(/'ve\b/g,' have').replace(/'re\b/g,' are')
    .replace(/[.,!?;:"«»]/g,'').replace(/\s+/g,' ').trim();
}
function firstA(it){ return Array.isArray(it.a) ? it.a[0] : it.a; }
function isOk(it, val){
  const acc = (Array.isArray(it.a) ? it.a : [it.a]).map(x=>normAns(x,it.cs));
  const v = normAns(val,it.cs);
  const cands = [v, v.replace(/'s\b/g,' has'), v.replace(/'s\b/g,' is'), v.replace(/'d\b/g,' had'), v.replace(/'d\b/g,' would')];
  return cands.some(c=>acc.includes(c));
}
function sentHtml(q, fill){
  let s = esc(q).replace(/\((.*?)\)/g,'<span class="hint">($1)</span>');
  if(fill){ s = s.replace('___', `<mark>${esc(fill)}</mark>`).replace(/\s?<span class="hint">.*?<\/span>/,''); }
  else s = s.replace('___','<span class="blank"></span>');
  return s;
}
function fmt(l){ return esc(l).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/_(.+?)_/g,'<i>$1</i>'); }
function setsHtml(){
  if(!sets.length) return '';
  const groups = {};
  for(const st of sets){ (groups[st.group||'Упражнения'] ||= []).push(st); }
  return Object.entries(groups).map(([g, arr]) => `<h2 class="sec">${esc(g)}</h2><div class="modes">${arr.map(st=>{
    const s=stats(st.items), n=st.items.length;
    if(st.mode==='test'){ const h=testHistory(st), last=h[h.length-1];
      return `<button class="mode" data-set="${esc(st.id)}"><span><span class="t">${esc(st.title)}</span><br><span class="d">${n} вопросов · последний результат ${last.total}/${n}</span></span></button>`; }
    const sub = s.fresh===n ? `${n} ${plural(n,'задание','задания','заданий')}${st.level?', '+esc(st.level):''}` : `${s.due} к повторению, ${s.done} выучено из ${n}`;
    return `<button class="mode" data-set="${esc(st.id)}"><span><span class="t">${esc(st.title)}</span><br><span class="d">${sub}</span></span>${s.err?`<span class="n">${s.err} ${plural(s.err,'ошибка','ошибки','ошибок')}</span>`:''}</button>`;
  }).join('')}</div>`).join('');
}
function openSet(set){
  if(set.mode==='test') return openTest(set);
  session=null;
  const s=stats(set.items), n=set.items.length;
  render(`
    <h1 class="brand" style="font-size:28px;margin-top:16px">${esc(set.title)}</h1>
    <p class="small" style="margin:0">${n} ${plural(n,'задание','задания','заданий')}${set.level?', уровень '+esc(set.level):''}: ${s.fresh} новых, ${s.due} к повторению, ${s.done} выучено.</p>
    <ul class="intro">${(set.intro||[]).map(l=>`<li>${fmt(l)}</li>`).join('')}</ul>
    <div class="actions" style="margin-top:24px">${s.err?`<button class="btn" id="errs">Только ошибки</button>`:''}<button class="btn primary" id="go">Начать</button></div>
  `, {title:set.group||'Упражнения', back:home});
  $('#go').onclick=()=>startSet(set,false);
  const e=$('#errs'); if(e) e.onclick=()=>startSet(set,true);
}
function startSet(set, errorsOnly){
  const P=set.items; let list_;
  if(errorsOnly) list_=shuffle(P.filter(isError));
  else list_=[...shuffle(P.filter(isDue)), ...shuffle(P.filter(w=>status(w)==='new')), ...shuffle(P.filter(w=>!isDue(w)&&status(w)!=='new'))];
  const queue=shuffle(list_.slice(0, errorsOnly ? list_.length : settings.size));
  if(!queue.length){ toast('Нечего повторять'); return; }
  session={kind:'ex', set, queue, i:0, first:{}, wrong:[], retried:new Set()};
  next();
}
// ---------- test mode: fixed questions, no spaced repetition, results by section ----------
function loadTests(){ return safeJSON(store.get('ew_tests'), {}); }
function testHistory(set){ const b=set.baseline ? [{label:set.baseline.label, total:set.baseline.total, sec:set.baseline.sec}] : []; return b.concat(loadTests()[set.id]||[]); }
function fmtDate(iso){ try { return new Date(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}); } catch(e){ return iso; } }
function openTest(set){
  session=null;
  const h=testHistory(set), n=set.items.length;
  render(`
    <h1 class="brand" style="font-size:28px;margin-top:16px">${esc(set.title)}</h1>
    <p class="small" style="margin:0">${n} вопросов, без таймера.</p>
    <ul class="intro">${(set.intro||[]).map(l=>`<li>${fmt(l)}</li>`).join('')}</ul>
    ${h.length?`<h2 class="sec" style="font-size:19px">Результаты</h2><ul class="res">${h.map(r=>`<li><span>${esc(r.label||fmtDate(r.d))}</span><span>${r.total} / ${n}</span></li>`).join('')}</ul>`:''}
    <div class="actions" style="margin-top:24px"><button class="btn primary" id="go">Начать тест</button></div>
  `, {title:set.group||'Тест', back:home});
  $('#go').onclick=()=>{ session={kind:'test', set, queue:set.items.slice(), i:0, first:{}, wrong:[], retried:new Set()}; next(); };
}
function testSummary(){
  const set=session.set, n=set.items.length, sec={};
  for(const it of set.items){ const k=it.sec||'Всего'; sec[k] ||= [0,0]; sec[k][1]++; if(session.first[it.id]) sec[k][0]++; }
  const total=Object.values(sec).reduce((a,[o])=>a+o,0);
  const prev=testHistory(set).pop();
  const all=loadTests(); (all[set.id] ||= []).push({d:new Date().toISOString(), total, sec}); store.set('ew_tests', JSON.stringify(all));
  const delta=(now,was)=> was==null ? '' : now>was ? ` <span class="up">+${now-was}</span>` : now<was ? ` <span class="down">${now-was}</span>` : '';
  const wrong=session.wrong;
  render(`
    <div class="summary">
      <h2>${total} из ${n}</h2>
      <p class="small" style="margin:0">${prev ? `В прошлый раз: ${prev.total} из ${n}.` : ''}</p>
      <ul class="res">${Object.entries(sec).map(([k,[o,of]])=>`<li><span>${esc(k)}</span><span>${o} / ${of}${delta(o, prev&&prev.sec&&prev.sec[k]?prev.sec[k][0]:null)}</span></li>`).join('')}</ul>
      ${wrong.length?`<h2 class="sec" style="font-size:19px">Ошибки</h2><ul class="wrongs">${wrong.map(w=>`<li><div class="e"><span>${sentHtml(w.q, firstA(w))}</span></div>${w.x?`<div class="r">${esc(w.x)}</div>`:''}</li>`).join('')}</ul>`:''}
      <div class="actions" style="margin-top:28px"><button class="btn primary" id="hm">На главную</button></div>
    </div>
  `, {title:'Результат', back:home, right:''});
  $('#hm').onclick=home;
}
function exScreen(it){ ({gap:gapScreen, choice:choiceScreen, fix:fixScreen, order:orderScreen})[it.type](it); }
function finishEx(it, ok, correct){
  record(it, ok);
  const v=$('#verdict');
  if(ok){ v.textContent='Верно'; v.className='verdict ok'; }
  else { v.innerHTML = correct ? `Правильно: <b>${esc(correct)}</b>` : 'Ошибка'; v.className='verdict no'; }
  if(it.x) $('#why').textContent=it.x;
  nextButton();
}
function gapScreen(it){
  render(`
    <div class="stage">
      <p class="pos">${TYPE_LABEL.gap}</p>
      <p class="sent" id="sent">${sentHtml(it.q)}</p>
      <input class="input" id="inp" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="твой вариант" enterkeyhint="done">
      <p class="verdict" id="verdict"></p><p class="why" id="why"></p>
    </div>
    <div class="actions" id="acts"><button class="btn primary" id="chk">Проверить</button></div>
  `, sessionOpts());
  const inp=$('#inp'); setTimeout(()=>inp.focus(),50); let done=false;
  const check=()=>{ if(done||!inp.value.trim()) return; done=true; inp.disabled=true;
    const ok=isOk(it, inp.value); $('#sent').innerHTML=sentHtml(it.q, firstA(it)); finishEx(it, ok, null); $('#nxt').focus(); };
  $('#chk').onclick=check; inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } };
}
function choiceScreen(it){
  const opts=shuffle(it.opts);
  render(`
    <div class="stage">
      <p class="pos">${TYPE_LABEL.choice}</p>
      <p class="sent" id="sent">${sentHtml(it.q)}</p>
      <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
      <p class="verdict" id="verdict"></p><p class="why" id="why"></p>
    </div>
    <div class="actions" id="acts"></div>
  `, sessionOpts());
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const val=opts[+b.dataset.i], ok=isOk(it,val);
    document.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(isOk(it,opts[+x.dataset.i])) x.classList.add('correct'); });
    if(!ok) b.classList.add('wrong');
    $('#sent').innerHTML=sentHtml(it.q, firstA(it));
    finishEx(it, ok, null);
  });
}
function fixScreen(it){
  render(`
    <div class="stage">
      <p class="pos">${TYPE_LABEL.fix}</p>
      <p class="task">${esc(it.t || session.set.fixTask || 'В предложении одна ошибка. Исправь её прямо в тексте.')}</p>
      <textarea class="input" id="inp" rows="3" autocorrect="off" autocapitalize="off" spellcheck="false">${esc(it.q)}</textarea>
      <p class="verdict" id="verdict"></p><p class="why" id="why"></p>
    </div>
    <div class="actions" id="acts"><button class="btn primary" id="chk">Проверить</button></div>
  `, sessionOpts());
  const inp=$('#inp'); let done=false;
  $('#chk').onclick=()=>{ if(done) return; done=true; inp.disabled=true;
    if(isOk(it, inp.value)) return finishEx(it, true);
    $('#verdict').innerHTML=`Образец: <b>${esc(firstA(it))}</b>`; $('#verdict').className='verdict no';
    if(it.x) $('#why').textContent=it.x;
    $('#acts').innerHTML=`<button class="btn bad" id="no">Ошибка</button><button class="btn good" id="yes">Засчитать</button>`;
    $('#no').onclick=()=>{record(it,false);advance();}; $('#yes').onclick=()=>{record(it,true);advance();};
  };
}
function orderScreen(it){
  const raw = firstA(it).split(' ');
  const toks = raw.map((w,i)=>({w: i===0 && !/^I('|$)/.test(w) ? w[0].toLowerCase()+w.slice(1) : w, i}));
  const bank=shuffle(toks); let ans=[]; let done=false;
  render(`
    <div class="stage">
      <p class="pos">${TYPE_LABEL.order}</p>
      <p class="task">Нажимай слова по порядку.</p>
      <div class="answer" id="ans"></div>
      <div class="bank" id="bank"></div>
      <p class="verdict" id="verdict"></p><p class="why" id="why"></p>
    </div>
    <div class="actions" id="acts"><button class="btn primary" id="chk" disabled>Проверить</button></div>
  `, sessionOpts());
  const draw=()=>{
    $('#ans').innerHTML=ans.map(t=>`<button class="tok" data-i="${t.i}">${esc(t.w)}</button>`).join('');
    $('#bank').innerHTML=bank.filter(t=>!ans.includes(t)).map(t=>`<button class="tok" data-i="${t.i}">${esc(t.w)}</button>`).join('');
    $('#chk').disabled = ans.length!==bank.length;
    $('#ans').querySelectorAll('.tok').forEach(b=>b.onclick=()=>{ if(done) return; ans=ans.filter(t=>t.i!==+b.dataset.i); draw(); });
    $('#bank').querySelectorAll('.tok').forEach(b=>b.onclick=()=>{ if(done) return; ans.push(bank.find(t=>t.i===+b.dataset.i)); draw(); });
  };
  draw();
  $('#chk').onclick=()=>{ if(done||ans.length!==bank.length) return; done=true;
    const ok=isOk(it, ans.map(t=>t.w).join(' ')); finishEx(it, ok, ok?null:firstA(it)); };
}

(async()=>{ await loadWords(); home(); })();
</script>
</body>
